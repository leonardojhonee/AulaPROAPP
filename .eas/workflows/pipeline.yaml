name: Pipeline CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  unit_tests:
    name: Testes unitários
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Executar testes
        run: npm test -- --ci --watchAll=false
